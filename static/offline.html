<!doctype html>
<!--
	Navigation fallback for a cold start with no network, served by the service worker.

	Deliberately a static file rather than a SvelteKit route: it must contain no signed-in
	content, because anything the service worker caches outlives the session cookie and
	would otherwise be readable after sign-out by going offline.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#faf9f5" />
		<title>Offline · PlanDump</title>
		<style>
			:root {
				color-scheme: light;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.75rem;
				padding: 2rem 1.5rem;
				background: #faf9f5;
				color: #0f0f0f;
				font-family:
					'Nunito Variable', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
				text-align: center;
			}
			img {
				width: 72px;
				height: 72px;
			}
			h1 {
				margin: 0.5rem 0 0;
				font-size: 1.375rem;
				color: #aa3500;
			}
			p {
				margin: 0;
				max-width: 18rem;
				font-size: 0.9375rem;
				line-height: 1.6;
				color: #6b625e;
			}
			button {
				margin-top: 0.75rem;
				padding: 0.875rem 1.75rem;
				border: 0;
				border-radius: 0.875rem;
				background: #fe6b35;
				color: #fff;
				font: inherit;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<img src="/icons/icon-192.png" alt="" />
		<h1>You're offline</h1>
		<p>PlanDump needs a connection to load plans. Reconnect and try again.</p>
		<button type="button" onclick="location.reload()">Try again</button>
	</body>
</html>
